{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 400px;">
    <div class="card-body">
        <h3 class="card-title mb-3">Profile</h3>
        <form method="POST">
            <div class="mb-3">
                <input type="text" name="full_name" class="form-control" placeholder="Full Name" value="{{ profile.full_name }}">
            </div>
            <div class="mb-3">
                <input type="text" name="phone" class="form-control" placeholder="Phone" value="{{ profile.phone }}">
            </div>
            <button type="submit" class="btn btn-primary w-100">Save</button>
        </form>
    </div>
</div>
{% endblock %}
