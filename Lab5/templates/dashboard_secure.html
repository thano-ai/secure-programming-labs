<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard (Secure)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <h2>Welcome {{ role|capitalize }}: {{ username }}</h2>

        {% if role =='admin' %}
            <h3>All Users:</h3>
            <table border="1">
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Password</th>
                </tr>
                {% for user in users %}
                    <tr>
                        <td>{{ user.username }}</td>
                        <td>{{ user.role }}</td>
                        <td>{{ user.password }}</td>
                    </tr>
                {% endfor %}
            </table>
        {% else %}
            <p>You are a normal user. Enjoy your session!</p>
        {% endif %}

        <br>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</body>
</html>
